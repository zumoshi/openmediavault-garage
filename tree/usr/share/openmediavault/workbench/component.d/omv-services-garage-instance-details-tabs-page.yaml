version: "1.0"
type: component
data:
  name: omv-services-garage-instance-details-tabs-page
  type: tabsPage
  config:
    tabs:
      - type: datatable
        label: _("Datastores")
        config:
          autoReload: false
          hasFooter: false
          sorters:
            - dir: asc
              prop: sharedfoldername
          store:
            proxy:
              service: Garage
              get:
                method: getDatastoreList
                params:
                  instanceuuid: "{{ _routeParams.uuid }}"
          columns:
            - name: _("Shared folder")
              prop: sharedfoldername
              flexGrow: 1
              sortable: true
            - name: _("Capacity (GiB)")
              prop: capacity
              flexGrow: 1
              sortable: true
            - name: _("Status")
              prop: status
              flexGrow: 2
              sortable: false
          actions:
            - template: create
              execute:
                type: url
                url: "/services/garage/details/datastores/create/{{ _routeParams.uuid }}"
            - template: edit
              enabledConstraints:
                minSelected: 1
                maxSelected: 1
              execute:
                type: url
                url: "/services/garage/details/datastores/edit/{{ _routeParams.uuid }}/{{ _selected[0].uuid }}"
            - template: delete
              confirmationDialogConfig:
                template: confirmation-danger
                message: _("Removing a datastore takes two deletes. After the first one and an apply, Garage moves the data in this shared folder to the instance's other data folders. Objects stay readable meanwhile, and the Status column shows the progress. Once it says the datastore is empty, delete it again and apply to remove it.")
              execute:
                type: request
                request:
                  service: Garage
                  method: deleteDatastore
                  params:
                    uuid: "{{ _selected[0].uuid }}"
      - type: datatable
        label: _("Buckets")
        config:
          autoReload: false
          hasFooter: false
          hasSearchField: true
          sorters:
            - dir: asc
              prop: label
          rowId: id
          store:
            proxy:
              service: Garage
              get:
                method: getBucketList
                params:
                  instanceuuid: "{{ _routeParams.uuid }}"
          columns:
            - name: _("Name")
              prop: label
              flexGrow: 1
              sortable: true
            - name: _("Website")
              prop: website
              flexGrow: 1
              sortable: true
              cellTemplateName: checkIcon
            - name: _("Objects")
              prop: objects
              flexGrow: 1
              sortable: true
            - name: _("Size")
              prop: bytes
              flexGrow: 1
              sortable: true
              cellTemplateName: template
              cellTemplateConfig: '{{ bytes | tobytes | binaryunit | notavailable("-") }}'
          actions:
            - template: create
              execute:
                type: url
                url: "/services/garage/details/buckets/create/{{ _routeParams.uuid }}"
            - template: edit
              enabledConstraints:
                minSelected: 1
                maxSelected: 1
              execute:
                type: url
                url: "/services/garage/details/buckets/edit/{{ _routeParams.uuid }}/{{ _selected[0].id }}"
            - template: delete
              confirmationDialogConfig:
                template: confirmation-danger
                message: _("Are you sure you want to delete this bucket? All objects in it will be lost.")
              execute:
                type: request
                request:
                  service: Garage
                  method: deleteBucket
                  params:
                    instanceuuid: "{{ _routeParams.uuid }}"
                    id: "{{ _selected[0].id }}"
      - type: datatable
        label: _("Access keys")
        config:
          autoReload: false
          hasFooter: false
          hasSearchField: true
          sorters:
            - dir: asc
              prop: name
          rowId: id
          store:
            proxy:
              service: Garage
              get:
                method: getKeyList
                params:
                  instanceuuid: "{{ _routeParams.uuid }}"
          columns:
            - name: _("Name")
              prop: name
              flexGrow: 1
              sortable: true
            - name: _("Key ID")
              prop: id
              flexGrow: 1
              sortable: true
          actions:
            - template: create
              execute:
                type: url
                url: "/services/garage/details/keys/create/{{ _routeParams.uuid }}"
            - template: edit
              enabledConstraints:
                minSelected: 1
                maxSelected: 1
              execute:
                type: url
                url: "/services/garage/details/keys/edit/{{ _routeParams.uuid }}/{{ _selected[0].id }}"
            - template: delete
              confirmationDialogConfig:
                template: confirmation-danger
                message: _("Are you sure you want to delete this access key? Clients using it will lose access.")
              execute:
                type: request
                request:
                  service: Garage
                  method: deleteKey
                  params:
                    instanceuuid: "{{ _routeParams.uuid }}"
                    id: "{{ _selected[0].id }}"
      - type: datatable
        label: _("Permissions")
        config:
          autoReload: false
          hasFooter: false
          hasSearchField: true
          sorters:
            - dir: asc
              prop: keyname
          rowId: id
          store:
            proxy:
              service: Garage
              get:
                method: getMappingList
                params:
                  instanceuuid: "{{ _routeParams.uuid }}"
          columns:
            - name: _("Access key")
              prop: keyname
              flexGrow: 1
              sortable: true
            - name: _("Bucket")
              prop: bucketname
              flexGrow: 1
              sortable: true
            - name: _("Read")
              prop: allowread
              flexGrow: 1
              sortable: true
              cellTemplateName: checkIcon
            - name: _("Write")
              prop: allowwrite
              flexGrow: 1
              sortable: true
              cellTemplateName: checkIcon
            - name: _("Owner")
              prop: allowowner
              flexGrow: 1
              sortable: true
              cellTemplateName: checkIcon
          actions:
            - template: create
              execute:
                type: url
                url: "/services/garage/details/permissions/create/{{ _routeParams.uuid }}"
            - template: edit
              enabledConstraints:
                minSelected: 1
                maxSelected: 1
              execute:
                type: url
                url: "/services/garage/details/permissions/edit/{{ _routeParams.uuid }}/{{ _selected[0].id }}"
            - template: delete
              confirmationDialogConfig:
                template: confirmation-danger
                message: _("Are you sure you want to remove this permission? The access key will no longer reach the bucket.")
              execute:
                type: request
                request:
                  service: Garage
                  method: deleteMapping
                  params:
                    instanceuuid: "{{ _routeParams.uuid }}"
                    id: "{{ _selected[0].id }}"
