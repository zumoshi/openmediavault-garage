version: "1.0"
type: component
data:
  name: omv-services-garage-datastores-form-page
  type: formPage
  config:
    request:
      service: Garage
      get:
        method: getDatastore
        params:
          uuid: "{{ _routeParams.uuid }}"
          instanceuuid: "{{ _routeParams.instanceuuid }}"
      post:
        method: setDatastore
    fields:
      - type: confObjUuid
      - type: hidden
        name: instanceuuid
        value: "{{ _routeParams.instanceuuid }}"
      - type: sharedFolderSelect
        name: shareuuid
        label: _("Shared folder")
        hint: _("The location where object data blocks are stored.")
        hasEmptyOption: true
        value: ""
        validators:
          required: true
      - type: numberInput
        name: capacity
        label: _("Capacity (GiB)")
        hint: _("Storage capacity assigned to this datastore in the Garage layout.")
        value: 10
        validators:
          required: true
          min: 1
          max: 100000000
    buttons:
      - template: submit
        execute:
          type: url
          url: "/services/garage/datastores/{{ _routeParams.instanceuuid }}"
      - template: cancel
        execute:
          type: url
          url: "/services/garage/datastores/{{ _routeParams.instanceuuid }}"
