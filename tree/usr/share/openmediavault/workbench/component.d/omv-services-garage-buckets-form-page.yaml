version: "1.0"
type: component
data:
  name: omv-services-garage-buckets-form-page
  type: formPage
  config:
    request:
      service: Garage
      get:
        method: getBucket
        params:
          instanceuuid: "{{ _routeParams.instanceuuid }}"
          id: "{{ _routeParams.id }}"
      post:
        method: setBucket
    fields:
      - type: hidden
        name: instanceuuid
        value: "{{ _routeParams.instanceuuid }}"
      - type: hidden
        name: id
        value: ""
      - type: textInput
        name: name
        label: _("Name")
        hint: _("The bucket's global S3 alias. A bucket made without one, for example through a local alias, is listed by the start of its ID until you name it here.")
        value: ""
        validators:
          required: "{{ not (_routeConfig.data.editing | toboolean) }}"
          minLength: 3
          maxLength: 63
          pattern:
            pattern: "^[a-z0-9][a-z0-9.-]*[a-z0-9]$"
            errorData: _("Lowercase letters, digits, dots and dashes.")
      - type: divider
        title: _("Quotas")
      - type: numberInput
        name: maxsize
        label: _("Maximum size (GiB)")
        hint: _("0 = unlimited.")
        value: 0
        validators:
          required: true
          min: 0
      - type: numberInput
        name: maxobjects
        label: _("Maximum objects")
        hint: _("0 = unlimited.")
        value: 0
        validators:
          required: true
          min: 0
      - type: divider
        title: _("Website")
      - type: checkbox
        name: website
        label: _("Enable website hosting")
        value: false
      - type: textInput
        name: indexdoc
        label: _("Index document")
        value: index.html
        modifiers:
          - type: visible
            constraint:
              operator: truthy
              arg0:
                prop: website
      - type: textInput
        name: errordoc
        label: _("Error document")
        value: ""
        modifiers:
          - type: visible
            constraint:
              operator: truthy
              arg0:
                prop: website
    buttons:
      - template: submit
        execute:
          type: url
          url: "/services/garage/details/{{ _routeParams.instanceuuid }}"
      - template: cancel
        execute:
          type: url
          url: "/services/garage/details/{{ _routeParams.instanceuuid }}"
