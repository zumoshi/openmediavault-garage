version: "1.0"
type: component
data:
  name: omv-services-garage-instances-datatable-page
  type: datatablePage
  config:
    autoReload: false
    hasSearchField: true
    stateId: "4e8a91c2-57d3-4f6e-9b0c-2a7d5e1f3b62"
    hints:
      - type: info
        text: _("Select an instance to edit it, to open its details view (datastores, buckets, access keys, permissions) or to launch its web UI.")
        dismissible: true
        stateId: "3f5f4f52-9c4e-4e2b-9f0a-6b2d1c8a7e01"
    sorters:
      - dir: asc
        prop: name
    store:
      proxy:
        service: Garage
        get:
          method: getInstanceList
    columns:
      - name: _("Name")
        prop: name
        flexGrow: 1
        sortable: true
      - name: _("Status")
        prop: status
        flexGrow: 1
        sortable: true
        cellTemplateName: chip
        cellTemplateConfig:
          map:
            running:
              value: _("Running")
              class: "omv-background-color-pair-success"
            stopped:
              value: _("Stopped")
              class: "omv-background-color-pair-gray"
            disabled:
              value: _("Disabled")
              class: "omv-background-color-pair-warning"
      - name: _("Datastores")
        prop: datastorecount
        flexGrow: 1
        sortable: true
      - name: _("S3 port")
        prop: s3port
        flexGrow: 1
        sortable: true
      - name: _("RPC port")
        prop: rpcport
        flexGrow: 1
        sortable: true
      - name: _("Web UI")
        prop: webuirunning
        flexGrow: 1
        sortable: true
        cellTemplateName: checkIcon
    actions:
      - template: create
        execute:
          type: url
          url: "/services/garage/instances/create"
      - template: edit
        execute:
          type: url
          url: "/services/garage/instances/edit/{{ _selected[0].uuid }}"
      - type: iconButton
        icon: details
        tooltip: _("Show details")
        enabledConstraints:
          minSelected: 1
          maxSelected: 1
        execute:
          type: url
          url: "/services/garage/details/{{ _selected[0].uuid }}"
      - template: delete
        confirmationDialogConfig:
          template: confirmation-danger
          message: _("Are you sure you want to delete this Garage instance? All instance files and configuration will be removed.")
        execute:
          type: request
          request:
            service: Garage
            method: deleteInstance
            params:
              uuid: "{{ _selected[0].uuid }}"
      - type: iconButton
        icon: mdi:monitor-dashboard
        tooltip: _("Web UI. Requires 'Enable web UI' in the instance settings.")
        enabledConstraints:
          minSelected: 1
          maxSelected: 1
          constraint:
            - operator: truthy
              arg0:
                prop: webuienable
        execute:
          type: url
          url: "/externalRedirect/%2Fgarage-sso%2F%3Finstance%3D{{ _selected[0].name }}"
