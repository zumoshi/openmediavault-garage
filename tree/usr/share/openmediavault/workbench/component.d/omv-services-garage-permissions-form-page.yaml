version: "1.0"
type: component
data:
  name: omv-services-garage-permissions-form-page
  type: formPage
  config:
    request:
      service: Garage
      get:
        method: getMapping
        params:
          instanceuuid: "{{ _routeParams.instanceuuid }}"
          id: "{{ _routeParams.id }}"
      post:
        method: setMapping
    fields:
      - type: hidden
        name: instanceuuid
        value: "{{ _routeParams.instanceuuid }}"
      - type: select
        name: keyid
        label: _("Access key")
        textField: label
        valueField: id
        value: ""
        disabled: "{{ _routeConfig.data.editing | toboolean }}"
        validators:
          required: true
        store:
          proxy:
            service: Garage
            get:
              method: enumerateKeys
              params:
                instanceuuid: "{{ _routeParams.instanceuuid }}"
      - type: select
        name: bucketid
        label: _("Bucket")
        textField: label
        valueField: id
        value: ""
        disabled: "{{ _routeConfig.data.editing | toboolean }}"
        validators:
          required: true
        store:
          proxy:
            service: Garage
            get:
              method: enumerateBuckets
              params:
                instanceuuid: "{{ _routeParams.instanceuuid }}"
      - type: checkbox
        name: allowread
        label: _("Read")
        value: true
      - type: checkbox
        name: allowwrite
        label: _("Write")
        value: true
      - type: checkbox
        name: allowowner
        label: _("Owner")
        value: false
    buttons:
      - template: submit
        execute:
          type: url
          url: "/services/garage/details/{{ _routeParams.instanceuuid }}"
      - template: cancel
        execute:
          type: url
          url: "/services/garage/details/{{ _routeParams.instanceuuid }}"
