version: "1.0"
type: component
data:
  name: omv-services-garage-instance-form-page
  type: formPage
  config:
    request:
      service: Garage
      get:
        method: getInstance
        params:
          uuid: "{{ _routeParams.uuid }}"
      post:
        method: setInstance
    fields:
      - type: confObjUuid
      - type: checkbox
        name: enable
        label: _("Enabled")
        value: true
      - type: textInput
        name: name
        label: _("Name")
        hint: _("Lowercase letters, digits and dashes. Used in unit names and URLs, cannot be changed later.")
        value: ""
        disabled: "{{ _routeConfig.data.editing | toboolean }}"
        validators:
          required: true
          pattern:
            pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"
            errorData: _("Lowercase letters, digits and dashes.")
          maxLength: 32
      - type: divider
        title: _("Storage")
      - type: select
        name: storageshareuuid
        label: _("Storage shared folder")
        hint: _("Holds the whole instance. Data goes to the subfolder data/ and metadata to the subfolder meta/. Extra data disks can be added in the details view under Datastores.")
        placeholder: _("Select a shared folder ...")
        value: ""
        valueField: uuid
        textField: name
        store:
          proxy:
            service: ShareMgmt
            get:
              method: enumerateSharedFolders
          sorters:
            - dir: asc
              prop: name
        validators:
          required: true
      - type: numberInput
        name: storagecapacity
        label: _("Storage folder capacity (GiB)")
        hint: _("Needed once the instance has datastores. Garage spreads new data over the storage folder and the datastores in proportion to their capacities. It is not a size limit.")
        value: 0
        validators:
          min: 0
          max: 100000000
        modifiers:
          - type: visible
            constraint:
              operator: falsy
              arg0:
                prop: storagesplit
      - type: divider
        title: _("Ports")
      - type: numberInput
        name: s3port
        label: _("S3 API port")
        hint: _("The S3 API is always enabled and listens on all interfaces.")
        value: 3900
        validators:
          required: true
          min: 1
          max: 65535
          patternType: port
      - type: numberInput
        name: rpcport
        label: _("RPC port")
        hint: _("The internal cluster RPC is always enabled and listens on the loopback interface only.")
        value: 3901
        validators:
          required: true
          min: 1
          max: 65535
          patternType: port
      - type: numberInput
        name: adminport
        label: _("Admin API port")
        hint: _("Used by OpenMediaVault and the web UI. Listens on the loopback interface only.")
        value: 3903
        validators:
          required: true
          min: 1
          max: 65535
          patternType: port
      - type: checkbox
        name: webenable
        label: _("Enable website hosting")
        value: false
        hint: _("Expose buckets as websites (S3 website hosting).")
      - type: numberInput
        name: webport
        label: _("Website port")
        value: 3902
        validators:
          required: true
          min: 1
          max: 65535
          patternType: port
        modifiers:
          - type: visible
            constraint:
              operator: truthy
              arg0:
                prop: webenable
      - type: textInput
        name: webrootdomain
        label: _("Website root domain")
        hint: _("Optional. Buckets are served as <bucket>.<root domain>.")
        value: ""
        validators:
          pattern:
            pattern: '^(\.?[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?)*)?$'
            errorData: _("A domain name, e.g. .s3.example.com.")
        modifiers:
          - type: visible
            constraint:
              operator: truthy
              arg0:
                prop: webenable
      - type: divider
        title: _("Web UI")
      - type: checkbox
        name: webuienable
        label: _("Enable web UI")
        value: false
        hint: _("Served through the OpenMediaVault web interface at /garage-webui-<name>/, never exposed directly.")
      - type: textInput
        name: webuiuser
        label: _("Web UI user name")
        value: admin
        validators:
          required: true
          pattern:
            pattern: '^[A-Za-z0-9._-]+$'
            errorData: _("Letters, digits, dots, dashes and underscores.")
        modifiers:
          - type: visible
            constraint:
              operator: truthy
              arg0:
                prop: webuienable
      - type: hint
        text: _("A web UI password is generated automatically. Use 'Open > Web UI' on the Instances page to sign in without entering it. Regenerate it with Garage.renewWebUiPassword if needed.")
      - type: divider
        title: _("S3")
      - type: textInput
        name: s3region
        label: _("Region")
        value: garage
        validators:
          required: true
          pattern:
            pattern: '^[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?$'
            errorData: _("Letters, digits and dashes, e.g. garage or us-east-1.")
      - type: textInput
        name: s3rootdomain
        label: _("S3 root domain")
        hint: _("Optional. Enables vhost-style access, buckets served as <bucket>.<root domain>.")
        value: ""
        validators:
          pattern:
            pattern: '^(\.?[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?)*)?$'
            errorData: _("A domain name, e.g. .s3.example.com.")
      - type: textInput
        name: s3publicendpoint
        label: _("Public endpoint")
        hint: _("Optional. The public URL Garage advertises for objects, e.g. https://s3.example.com. Must include http:// or https://.")
        value: ""
        validators:
          pattern:
            pattern: '^($|https?:\/\/\S+)$'
            errorData: _("A URL with http:// or https://, e.g. https://s3.example.com.")
      - type: divider
        title: _("Advanced")
      - type: checkbox
        name: storagesplit
        label: _("Separate metadata shared folder")
        value: false
        hint: _("Store the metadata database on its own shared folder, for example on faster local storage. Data must then be provided by at least one datastore in the details view.")
      - type: select
        name: metadatashareuuid
        label: _("Metadata shared folder")
        hint: _("Stores the metadata database in the subfolder meta/.")
        placeholder: _("Select a shared folder ...")
        value: ""
        valueField: uuid
        textField: name
        store:
          proxy:
            service: ShareMgmt
            get:
              method: enumerateSharedFolders
          sorters:
            - dir: asc
              prop: name
        validators:
          requiredIf:
            operator: truthy
            arg0:
              prop: storagesplit
        modifiers:
          - type: visible
            constraint:
              operator: truthy
              arg0:
                prop: storagesplit
      - type: select
        name: snapshotsshareuuid
        label: _("Snapshots shared folder")
        hint: _("Optional. Metadata snapshots can grow up to 4x the database size.")
        hasEmptyOption: true
        value: ""
        valueField: uuid
        textField: name
        store:
          proxy:
            service: ShareMgmt
            get:
              method: enumerateSharedFolders
          sorters:
            - dir: asc
              prop: name
      - type: textInput
        name: snapshotinterval
        label: _("Automatic snapshot interval")
        hint: _("Empty to disable, otherwise a time span, e.g. 6h or 1d.")
        value: ""
        validators:
          pattern:
            pattern: '^([0-9]+(\.[0-9]+)? *[a-z]+ *)*$'
            errorData: _("A time span, e.g. 6h, 1d or 1d 12h.")
      - type: select
        name: dbengine
        label: _("Database engine")
        value: lmdb
        store:
          data:
            - - lmdb
              - "LMDB (default)"
            - - sqlite
              - "SQLite"
      - type: textInput
        name: lmdbmapsize
        label: _("LMDB map size")
        hint: _("Optional capacity string, e.g. 1TiB.")
        value: ""
        validators:
          pattern:
            pattern: '^([0-9]+|[0-9]+(\.[0-9]+)? *([kKmMgGtTpPeE][iI]?[bB]?|[bB]))?$'
            errorData: _("A number with an optional unit, e.g. 1MiB or 512 KiB.")
        modifiers:
          - type: visible
            constraint:
              operator: eq
              arg0:
                prop: dbengine
              arg1: lmdb
      - type: checkbox
        name: metadatafsync
        label: _("Fsync metadata")
        value: false
        hint: _("Safer, but slower.")
      - type: checkbox
        name: datafsync
        label: _("Fsync data")
        value: false
        hint: _("Safer, but slower.")
      - type: checkbox
        name: disablescrub
        label: _("Disable data scrub")
        value: false
      - type: numberInput
        name: compressionlevel
        label: _("Zstd compression level")
        hint: _("0 = zstd default, negative = faster, up to 22 = best.")
        value: 1
        validators:
          min: -99
          max: 22
        modifiers:
          - type: disabled
            constraint:
              operator: truthy
              arg0:
                prop: compressiondisable
      - type: checkbox
        name: compressiondisable
        label: _("Disable compression")
        value: false
      - type: select
        name: loglevel
        label: _("Log level")
        value: info
        store:
          data:
            - - error
              - "Error"
            - - warn
              - "Warning"
            - - info
              - "Info"
            - - debug
              - "Debug"
            - - trace
              - "Trace"
      - type: textInput
        name: blocksize
        label: _("Block size")
        hint: _("Optional capacity string, e.g. 1MiB. Only affects new uploads.")
        value: ""
        validators:
          pattern:
            pattern: '^([0-9]+|[0-9]+(\.[0-9]+)? *([kKmMgGtTpPeE][iI]?[bB]?|[bB]))?$'
            errorData: _("A number with an optional unit, e.g. 1MiB or 512 KiB.")
      - type: textInput
        name: blockrambuffermax
        label: _("Block RAM buffer max")
        hint: _("Optional capacity string, e.g. 256MiB.")
        value: ""
        validators:
          pattern:
            pattern: '^([0-9]+|[0-9]+(\.[0-9]+)? *([kKmMgGtTpPeE][iI]?[bB]?|[bB]))?$'
            errorData: _("A number with an optional unit, e.g. 1MiB or 512 KiB.")
      - type: numberInput
        name: blockmaxconcurrentreads
        label: _("Max concurrent block reads")
        value: 16
        validators:
          min: 1
          max: 1024
      - type: numberInput
        name: blockmaxconcurrentwrites
        label: _("Max concurrent block writes per request")
        value: 3
        validators:
          min: 1
          max: 1024
    buttons:
      - template: submit
        execute:
          type: url
          url: "/services/garage/instances"
      - template: cancel
        execute:
          type: url
          url: "/services/garage/instances"
