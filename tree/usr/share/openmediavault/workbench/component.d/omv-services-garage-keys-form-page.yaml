version: "1.0"
type: component
data:
  name: omv-services-garage-keys-form-page
  type: formPage
  config:
    request:
      service: Garage
      get:
        method: getKey
        params:
          instanceuuid: "{{ _routeParams.instanceuuid }}"
          id: "{{ _routeParams.id }}"
      post:
        method: setKey
    fields:
      - type: hidden
        name: instanceuuid
        value: "{{ _routeParams.instanceuuid }}"
      - type: hidden
        name: id
        value: ""
      - type: textInput
        name: name
        label: _("Name")
        value: ""
        validators:
          required: true
          maxLength: 128
      - type: textInput
        name: keyid
        label: _("Key ID")
        value: ""
        readonly: true
        hasCopyToClipboardButton: true
        modifiers:
          - type: visible
            constraint:
              operator: notEmpty
              arg0:
                prop: id
      - type: passwordInput
        name: secret
        label: _("Secret")
        value: ""
        readonly: true
        autocomplete: "off"
        hasCopyToClipboardButton: true
        modifiers:
          - type: visible
            constraint:
              operator: notEmpty
              arg0:
                prop: id
      - type: textInput
        name: importid
        label: _("Key ID to import")
        hint: _("Optional. Leave both import fields empty to create a new key. Open the key from the list afterwards to see its secret.")
        autocomplete: "off"
        value: ""
        modifiers:
          - type: visible
            constraint:
              operator: empty
              arg0:
                prop: id
      - type: passwordInput
        name: importsecret
        label: _("Secret to import")
        autocomplete: "off"
        value: ""
        modifiers:
          - type: visible
            constraint:
              operator: empty
              arg0:
                prop: id
    buttons:
      - template: submit
        execute:
          type: url
          url: "/services/garage/details/{{ _routeParams.instanceuuid }}"
      - template: cancel
        execute:
          type: url
          url: "/services/garage/details/{{ _routeParams.instanceuuid }}"
