version: "1.0"
type: component
data:
  name: omv-services-garage-settings-form-page
  type: formPage
  config:
    request:
      service: Garage
      get:
        method: getSettings
      post:
        method: setSettings
    fields:
      - type: checkbox
        name: enable
        label: _("Enabled")
        value: false
        hint: _("Master switch. When disabled, all Garage instances are stopped.")
      - type: paragraph
        text: _("Garage instances are configured on the Instances tab. Bucket, key and access changes require the instance to be running.")
    buttons:
      - template: submit
      - template: cancel
        execute:
          type: url
          url: "/services/garage"
