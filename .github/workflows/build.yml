name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Plugin version, e.g. 0.1.0; must match debian/changelog"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            v="${{ inputs.version }}"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          case "$v" in
          *[!0-9.]* | "") echo "invalid version '$v'" >&2; exit 1 ;;
          esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Install nfpm
        run: |
          echo "deb [trusted=yes] https://apt.fury.io/goreleaser/ /" | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nfpm
      - name: Build deb
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
